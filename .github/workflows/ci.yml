name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # コミット済みの src/*.js が src/*.ts のビルド結果と一致することを確認します。
      - run: npm run build && git diff --exit-code && test -z "$(git status --porcelain)"
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose run --rm check
      - run: docker compose up --build --detach --wait web
      - run: curl -fsS --retry 5 --retry-connrefused http://localhost:8080/ | grep -q '<title>web-rtc-lab!</title>'
      - run: curl -fsS --retry 5 --retry-connrefused http://localhost:8080/src/main.js | grep -q 'startCamera'
