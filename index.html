<!doctype html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="src/style.css">

  <title>web-rtc-lab!</title>
</head>

<body>
    <main role="main" class="mx-3 mb-3">
      <div class="row">
        <div class="col-md-6 mt-3">
          <div class="card text-center">
            <div class="card-header p-0">
              user
            </div>
            <div class="card-body p-0 bg-dark video-main">
              <video id="video1" autoplay playsinline class="mw-100 mh-100 mirrored">
              </video>
            </div>
          </div>
        </div>
        <div class="col-md-6 mt-3">
          <div class="row">
            <div class="col-md-6">
              <div class="card text-center">
                <div class="card-header p-0">
                  autoplay
                </div>
                <div class="card-body p-0 bg-dark video-sub">
                  <video autoplay class="video1-clone mw-100 mh-100">
                  </video>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="card text-center">
                <div class="card-header p-0">
                  autoplay playsinline
                </div>
                <div class="card-body p-0 bg-dark video-sub">
                  <video autoplay playsinline class="video1-clone mw-100 mh-100">
                  </video>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="card text-center">
                <div class="card-header p-0">
                  Take photo
                </div>
                <div class="card-body p-0 bg-dark video-sub">
                  <img id="image-for-video1" class="mw-100 mh-100" alt="">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mt-3">
          <div class="card text-center">
            <div class="card-header p-0">
              environment
            </div>
            <div class="card-body p-0 bg-dark video-main">
              <video id="video2" autoplay playsinline class="mw-100 mh-100">
              </video>
            </div>
          </div>
        </div>
        <div class="col-md-6 mt-3">
          <div class="row">
            <div class="col-md-6">
              <div class="card text-center">
                <div class="card-header p-0">
                  autoplay
                </div>
                <div class="card-body p-0 bg-dark video-sub">
                  <video autoplay class="video2-clone mw-100 mh-100">
                  </video>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="card text-center">
                <div class="card-header p-0">
                  autoplay playsinline
                </div>
                <div class="card-body p-0 bg-dark video-sub">
                  <video autoplay playsinline class="video2-clone mw-100 mh-100">
                  </video>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mt-3">
          <div class="card text-center">
            <div class="card-header p-0">
              experiment
            </div>
            <div class="card-body p-0 bg-dark video-main">
              <video id="video3" autoplay playsinline class="mw-100 mh-100">
              </video>
            </div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-3 mt-3">
          <button class="btn btn-info w-100" type="button" data-action="supportedConstraints">
            getSupportedConstraints
          </button>
        </div>
        <div class="col-md-3 mt-3">
          <button class="btn btn-info w-100" type="button" data-action="startUser">
            facingMode:user
          </button>
        </div>
        <div class="col-md-3 mt-3">
          <button class="btn btn-info w-100" type="button" data-action="takePhoto">
            Take photo facingMode:user
          </button>
        </div>
        <div class="col-md-3 mt-3">
          <button class="btn btn-danger w-100" type="button" data-action="shareUser">
            facingMode:user +
          </button>
        </div>
        <div class="col-md-3 mt-3">
          <button class="btn btn-info w-100" type="button" data-action="startEnvironment">
            facingMode:env
          </button>
        </div>
        <div class="col-md-3 mt-3">
          <button class="btn btn-danger w-100" type="button" data-action="shareEnvironment">
            facingMode:env +
          </button>
        </div>
        <div class="col-md-3 mt-3">
          <button class="btn btn-info w-100" type="button" data-action="startExperiment">
            Experiment
          </button>
        </div>
        <div class="col-md-3 mt-3">
          <button class="btn btn-info w-100" type="button" data-action="stop">
            Stop stream
          </button>
        </div>
      </div>

      <div class="card mt-3">
        <div class="card-body">
          <h6 class="card-subtitle mb-2 text-muted">getSupportedConstraints</h6>
          <p id="supported-constraints" class="card-text"></p>
        </div>
      </div>

    </main>

  <script type="module" src="src/main.js"></script>
</body>

</html>
